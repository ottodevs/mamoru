name: CI

on:
  pull_request:
  push:
    branches: [main, beta]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to the commit of a release tag (checked with `gh api repos/<owner>/<repo>/git/ref/tags/<tag>`).
      # To update: resolve the new tag to its commit the same way and change the sha and the comment together.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # typecheck, the tests that need only the checkout, and the production build: the gate the deploy scripts run.
      - run: bun run release:check
      # otto/mamoru#365: the e2e that runs offline (anvil on the committed MONAD-01 prestate, ~15 s). Unrun for 12 days,
      # it rotted; here it breaks the PR that breaks it. anvil at the lab's pin (scenarios/manifest.json).
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.7.1
      - run: bun apps/mamoru-operator/test/e2e-monad-fork.ts scenarios/monad/MONAD-01.prestate.json.gz
        env:
          MAMORU_PROFILE_AGE: warn
