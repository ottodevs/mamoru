# Spec 007 (otto/mamoru#151): on-chain action policy, PoC. Not deployed anywhere.
# Dependencies are not vendored: ./install.sh fetches them at pinned commits into lib/ (gitignored).
[profile.default]
src = "src"
test = "test"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 10000
via_ir = false
remappings = [
  "@uniswap/v3-core/=lib/v3-core/",
  "@uniswap/v3-periphery/=lib/v3-periphery/",
  "forge-std/=lib/forge-std/src/",
]

# MamoruActionPolicyV2 (#151, #171) at 1,000 optimizer runs: at 10,000 its runtime is over EIP-170's 24,576 bytes.
# Only that file (and what imports it) gets this profile; MamoruActionPolicy (deployed, verified byte for byte by
# packages/scenarios/action-policy/verify-deployed-policy.ts) keeps the default 10,000.
additional_compiler_profiles = [{ name = "v2", optimizer_runs = 1000 }]
compilation_restrictions = [{ paths = "src/MamoruActionPolicyV2.sol", optimizer_runs = 1000 }]
