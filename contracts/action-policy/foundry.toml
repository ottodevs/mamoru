# Spec 007 (otto/mamoru#151): on-chain action policy, PoC. Not deployed anywhere.
# Dependencies are not vendored: ./install.sh fetches them at pinned commits into lib/ (gitignored).
[profile.default]
src = "src"
test = "test"
libs = ["lib"]
solc_version = "0.8.28"
fs_permissions = [{ access = "read", path = "./test/fixtures" }, { access = "read", path = "./out" }]
evm_version = "cancun"
optimizer = true
optimizer_runs = 10000
via_ir = false
remappings = [
  "@uniswap/v3-core/=lib/v3-core/",
  "@uniswap/v3-periphery/=lib/v3-periphery/",
  "forge-std/=lib/forge-std/src/",
]

# MamoruActionPolicyV2 (#151, #171) at 1,000 optimizer runs with via_ir: at 10,000 runs, and after the LeftClaw M-5
# tick walk even at 1 run without via_ir, its runtime is over EIP-170's 24,576 bytes (via_ir: 23,102). Verify it the
# same way: solc 0.8.28, cancun, 1,000 runs, viaIR true.
# Only that file (and what imports it) gets this profile; MamoruActionPolicy (deployed, verified byte for byte by
# packages/scenarios/action-policy/verify-deployed-policy.ts) keeps the default 10,000.
# MamoruActionPolicyV3 (#116 T1) is V2 plus the ERC-4626 and CCTP families: at 1,000 runs it is 26,144 bytes, at 200
# runs (viaIR) 24,491, 85 under EIP-170 (1 run saves only 6 more). Verify it with solc 0.8.28, cancun, 200 runs, viaIR.
# Any further runtime addition to V3 needs a split (e.g. the vault and bridge checks in their own contract).
additional_compiler_profiles = [
  { name = "v2", optimizer_runs = 1000, via_ir = true },
  { name = "v3", optimizer_runs = 200, via_ir = true },
]
compilation_restrictions = [
  { paths = "src/MamoruActionPolicyV2.sol", optimizer_runs = 1000, via_ir = true },
  { paths = "src/MamoruActionPolicyV3.sol", optimizer_runs = 200, via_ir = true },
]
