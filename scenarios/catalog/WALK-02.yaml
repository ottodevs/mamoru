id: WALK-02
requirements: [FR-ACC-009, FR-ONB-003]
fork:
  source: base
  block: 51811000
  blockHash: "0xb7820875b174f7a8afb72d33464864e6cdfbe0c2173446cc8c4a5649923423ff"
  chainId: 31337
policy: conservador-lab-v1
world: sess
fixtures: [fx-owners, fx-safe, fx-gas, fx-usdc, fx-lp-direct, fx-sessions, fx-owner-position, fx-second-account, fx-whale]
prepare:
  # Without P-256 on this fork the scenario is not executed, with LAB_P256_UNAVAILABLE (LAB-08).
  - require-p256: {}
steps:
  # The engine, the app and MultiBaas are off. Only viem, the fork RPC, the passkey and the kit.
  - services-off: {}
  - owner-walkaway: { signer: passkey, sender: 3 }
  # The engine is off, so its ledger does not know the grants are gone: only the chain verdict counts.
  - session-op: { grant: enter-swap, batch: valid-swap, expect: { chain: CHAIN_REJECTED_VALIDATION, failedOp: account-validation } }
  - session-op: { grant: manage, batch: valid-collect, expect: { chain: CHAIN_REJECTED_VALIDATION, failedOp: account-validation } }
  - services-off: {}
expect:
  codes: [CHAIN_REJECTED_VALIDATION]
invariants: [INV-CODES, INV-FORK-CHAIN]
