id: SESS-09
requirements: [FR-ACC-008]
fork:
  source: base
  block: 51811000
  blockHash: "0xb7820875b174f7a8afb72d33464864e6cdfbe0c2173446cc8c4a5649923423ff"
  chainId: 31337
policy: conservador-lab-v1
world: sess
fixtures: [fx-owners, fx-safe, fx-gas, fx-usdc, fx-lp-direct, fx-sessions, fx-owner-position, fx-second-account, fx-whale]
notes: >
  manage is granted per position (tokenId EQUAL, plan §12.2). The owner's positions,
  minted before or after activation, have no manage grant.
steps:
  # a) the tokenId of fx-second-account
  - session-op:
      grant: manage
      batch: decrease-second-account
      otherGrants: reject
      expect: { chain: [CHAIN_REJECTED_VALIDATION, CHAIN_REVERTED_EXECUTION], precheck: POLICY_DENIED_POSITION, state: unchanged }
  # b) fx-owner-position, minted before activation
  - session-op:
      grant: manage
      batch: decrease-owner-position
      otherGrants: reject
      expect: { chain: CHAIN_REJECTED_VALIDATION, precheck: POLICY_DENIED_POSITION, failedOp: account-validation }
  # c) the owner mints another position after activation
  - owner-mint-position: {}
  - session-op:
      grant: manage
      batch: decrease-owner-position-latest
      otherGrants: reject
      expect: { chain: CHAIN_REJECTED_VALIDATION, precheck: POLICY_DENIED_POSITION, failedOp: account-validation }
expect:
  codes: [POLICY_DENIED_POSITION]
invariants: [INV-RECIPIENT, INV-TARGETS, INV-ETH-GAS, INV-CODES, INV-FORK-CHAIN]
